[tools]
hk = { version = "2.5.0", workflow = "release.yml" }
mr-boxington = { version = "1.23.0", workflow = "release.yml@refs/heads/main" }
uv = "0.13.0"

[tasks.check]
description = "Check formatting and lint all targets"
run = ["cargo fmt --check", "mbx clippy --all-targets --locked -- -D warnings"]

[tasks.test]
description = "Run fast tests without desktop or shell framework dependencies"
run = ["mbx test --locked", "./tests/e2e/cli_behavior.py target/debug/fpc", "./tests/e2e/release_checks.py"]

[tasks.build]
description = "Build the release binary"
run = "mbx build --release --locked"

[tasks.e2e]
description = "Run complete shell completion tests in an environment prepared like CI"
run = ["mbx build --locked", "./tests/e2e/shell_completion.py target/debug/fpc"]

[tasks.install]
description = "Install fpc from the current checkout"
# Select stable explicitly to avoid Cargo's implicit toolchain override warning
# when rustup selects the toolchain from rust-toolchain.toml.
run = "mbx +stable install --path . --locked"

[tasks.setup]
description = "Initialize the local development environment"
run = "hk install --mise"

[tasks.hooks-check]
description = "Run lightweight hook checks without installing hooks"
run = "hk check --all"

[tasks.ci]
description = "Run local checks and fast tests"
depends = ["check", "test"]

[tasks.acceptance]
description = "Run native desktop clipboard acceptance explicitly"
run = ["mbx build --locked", "./tests/acceptance/clipboard.py target/debug/fpc --allow-desktop"]
