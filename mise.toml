[tools]
hk = { version = "2.5.0", workflow = "release.yml" }
jactionlint = "2.1.0"
mr-boxington = { version = "1.23.0", workflow = "release.yml@refs/heads/main" }
uv = "0.13.0"

[tasks.check]
description = "Check formatting and lint all targets"
run = ["cargo fmt --check", "mbx clippy --all-targets --locked -- -D warnings", "jactionlint --no-online --shellcheck= --pyflakes="]

[tasks.test]
description = "Run fast tests without desktop or shell framework dependencies"
run = ["mbx test --locked", "./tests/e2e/cli_behavior.py target/debug/fpc", "./tests/e2e/release_checks.py"]

[tasks.install]
description = "Install fpc from the current checkout"
run = "mbx +stable install --path . --locked"

[tasks.setup]
description = "Initialize the local development environment"
run = "hk install --mise"
