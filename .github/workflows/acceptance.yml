name: Terminal acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI owns shared cache writes; acceptance jobs reuse its entries.
cache-mode: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clipboard:
    name: Ghostty clipboard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
        with:
          install_args: uv
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: jdx/mr-boxington-action@v1
      - name: Install terminal environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server tmux xclip xvfb dbus-x11 libgl1-mesa-dri mesa-utils
          sudo mkdir -p /run/sshd
          curl --fail --location --output "$RUNNER_TEMP/ghostty.deb" https://github.com/mkasberg/ghostty-ubuntu/releases/download/1.3.1-0-ppa2/ghostty_1.3.1-0.ppa2_amd64_24.04.deb
          echo "478d440153ef544426418efc7d6d8901715359f452c46be29071901a94b8cd47  $RUNNER_TEMP/ghostty.deb" | sha256sum --check
          sudo apt-get install -y "$RUNNER_TEMP/ghostty.deb"
          echo "GHOSTTY_BINARY=/usr/bin/ghostty" >> "$GITHUB_ENV"
      - name: Install terminal environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          curl --fail --location --output "$RUNNER_TEMP/Ghostty.dmg" https://release.files.ghostty.org/1.3.1/Ghostty.dmg
          echo "18cff2b0a6cee90eead9c7d3064e808a252a40baf214aa752c1ecb793b8f5f69  $RUNNER_TEMP/Ghostty.dmg" | shasum -a 256 --check
          hdiutil attach "$RUNNER_TEMP/Ghostty.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/ghostty-volume"
          ditto "$RUNNER_TEMP/ghostty-volume/Ghostty.app" "$RUNNER_TEMP/Ghostty.app"
          hdiutil detach "$RUNNER_TEMP/ghostty-volume"
          echo "GHOSTTY_BINARY=$RUNNER_TEMP/Ghostty.app/Contents/MacOS/ghostty" >> "$GITHUB_ENV"
      - run: mbx build --locked
      - name: Clipboard acceptance (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
          GTK_A11Y: none
        run: |
          xvfb-run -a glxinfo -B
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' ./tests/acceptance/clipboard.py target/debug/fpc --artifacts acceptance-artifacts
      - name: Clipboard acceptance (macOS)
        if: runner.os == 'macOS'
        run: ./tests/acceptance/clipboard.py target/debug/fpc --artifacts acceptance-artifacts
      - name: Upload terminal diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: terminal-acceptance-${{ matrix.os }}
          path: acceptance-artifacts
          if-no-files-found: ignore
