name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
        with:
          install_args: uv
      - name: Validate package identity and version
        run: ./scripts/release_notes.py --check-package
      - name: Validate version and maintained release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release_notes.py "$TAG" > release-notes.md
      - name: Require an accepted main commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Prepare nightly notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fpc") | .version')"
          {
            printf '# Nightly build\n\nCommit:\n\n%s\n\n' "$GITHUB_SHA"
            printf 'Development build from main. Cargo version:\n\n%s\n\nThis is not a stable versioned release.\n\n' "$version"
            printf '## Unreleased changes\n\n'
            awk '
              /^## \[Unreleased\]$/ { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]:/ { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md
          } > release-notes.md
      - run: ./tests/e2e/release_checks.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
      - run: mbx fmt --check --all
      - run: mbx clippy --all-targets --locked -- -D warnings
      - run: cargo package --locked
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: prepare
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install musl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: jdx/mr-boxington-action@v1
        if: runner.os != 'macOS' || runner.arch != 'X64'
      - name: Test and build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          build_tool=mbx
          if [ "$RUNNER_OS" = macOS ] && [ "$RUNNER_ARCH" = X64 ]; then
            build_tool=cargo
          fi
          "$build_tool" test --locked --target "$TARGET"
          "$build_tool" build --release --locked --target "$TARGET"
      - name: Package and smoke-test archive
        env:
          TARGET: ${{ matrix.target }}
          NIGHTLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fpc") | .version')"
          archive="fpc-${TARGET}-v${version}"
          if [ "$NIGHTLY" = true ]; then
            archive="fpc-${TARGET}-nightly"
          fi
          mkdir -p "dist/$archive"
          cp "target/$TARGET/release/fpc" LICENSE "dist/$archive/"
          printf '%s\n' "$GITHUB_SHA" > "dist/$archive/revision.txt"
          tar -cf - -C dist "$archive" | xz -9 -T0 > "dist/$archive.txz"
          mkdir dist/smoke
          tar -xJf "dist/$archive.txz" -C dist/smoke
          test -f "dist/smoke/$archive/LICENSE"
          test "$(cat "dist/smoke/$archive/revision.txt")" = "$GITHUB_SHA"
          "dist/smoke/$archive/fpc" --version > dist/smoke/version.txt
          test "$(head -n 1 dist/smoke/version.txt)" = "fpc ${version}"
          grep -F "$GITHUB_SHA" dist/smoke/version.txt
          rm -r "dist/$archive" dist/smoke
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.txz
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.ref == 'refs/heads/main'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
      - name: Verify artifacts
        run: |
          test "$(find dist -name '*.txz' | wc -l)" -eq 4
          (cd dist && sha256sum ./*.txz > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish a new stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(gh api --paginate --slurp "repos/$GH_REPO/releases" | jq -r '[.[][] | select(.prerelease == false and .draft == false)] | first | .tag_name // empty')"
          notes_range=()
          if [ -n "$previous" ]; then
            notes_range=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" dist/*.txz dist/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file release-notes.md --generate-notes "${notes_range[@]}"
      - name: Replace the nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping stale nightly build $GITHUB_SHA; main is now $current."
            exit 0
          fi
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "nightly") | .id')"
          if [ -n "$existing" ]; then
            gh release delete nightly --yes
          fi
          git push --force origin "$GITHUB_SHA:refs/tags/nightly"
          gh release create nightly dist/*.txz dist/SHA256SUMS \
            --verify-tag --title "Nightly ${GITHUB_SHA:0:12}" \
            --notes-file release-notes.md --prerelease --latest=false
