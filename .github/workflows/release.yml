name: Release

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: uv
      - name: Validate package identity and version
        run: ./scripts/release.py --check-package
      - name: Validate version and maintained release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Require an accepted main commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Prepare nightly notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/release.py --nightly-commit "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
      - uses: $/.github/actions/setup-rust-ci
      - run: cargo package --locked
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build:
    needs: prepare
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install musl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils
          echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
      - uses: $/.github/actions/setup-rust-ci
        with:
          targets: ${{ matrix.target }}
      - name: Test and build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --timings --target "$TARGET"
          cargo build --release --locked --timings --target "$TARGET"
      - name: Verify binary runtime dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/fpc"
          if [ "$RUNNER_OS" = Linux ]; then
            readelf --program-headers "$binary" > program-headers.txt
            readelf --dynamic "$binary" > dynamic-section.txt
            if grep -w INTERP program-headers.txt || grep -F '(NEEDED)' dynamic-section.txt; then
              echo 'Linux release binary must be fully statically linked.' >&2
              exit 1
            fi
          else
            otool -L "$binary" | awk '
              NR > 1 {
                print $1
                if ($1 !~ /^\/usr\/lib\// && $1 !~ /^\/System\/Library\//) invalid = 1
              }
              END { exit invalid }
            '
          fi
      - name: Package and smoke-test archive
        env:
          TARGET: ${{ matrix.target }}
          NIGHTLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fpc") | .version')"
          archive="fpc-${TARGET}-v${version}"
          if [ "$NIGHTLY" = true ]; then
            archive="fpc-${TARGET}-nightly"
          fi
          mkdir -p "dist/$archive"
          cp "target/$TARGET/release/fpc" LICENSE "dist/$archive/"
          printf '%s\n' "$GITHUB_SHA" > "dist/$archive/revision.txt"
          tar -cf - -C dist "$archive" | xz -9 -T0 > "dist/$archive.txz"
          mkdir dist/smoke
          tar -xJf "dist/$archive.txz" -C dist/smoke
          test -f "dist/smoke/$archive/LICENSE"
          test "$(cat "dist/smoke/$archive/revision.txt")" = "$GITHUB_SHA"
          "dist/smoke/$archive/fpc" --version > dist/smoke/version.txt
          test "$(head -n 1 dist/smoke/version.txt)" = "fpc ${version}"
          grep -F "$GITHUB_SHA" dist/smoke/version.txt
          rm -r "dist/$archive" dist/smoke
      - uses: $/.github/actions/build-diagnostics
        if: always()
        with:
          name: release-build-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.txz
          if-no-files-found: error

  required:
    name: Release required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, build]
    if: always()
    steps:
      - name: Require package validation and all release builds to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$PREPARE_RESULT" = success && test "$BUILD_RESULT" = success

  publish:
    needs: [checks, prepare, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Verify artifacts
        run: |
          test "$(find dist -name '*.txz' | wc -l)" -eq 3
          (cd dist && sha256sum ./*.txz > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish a new stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(gh api --paginate --slurp "repos/$GH_REPO/releases" | jq -r '[.[][] | select(.prerelease == false and .draft == false)] | first | .tag_name // empty')"
          notes_range=()
          if [ -n "$previous" ]; then
            notes_range=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" dist/*.txz dist/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file release-notes.md --generate-notes "${notes_range[@]}"
      - name: Replace the nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping stale nightly build $GITHUB_SHA; main is now $current."
            exit 0
          fi
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "nightly") | .id')"
          if [ -n "$existing" ]; then
            gh release delete nightly --yes
          fi
          tag="$(gh api "repos/$GH_REPO/git/matching-refs/tags/nightly" --jq '.[] | select(.ref == "refs/tags/nightly") | .ref')"
          if [ -n "$tag" ]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"
          fi
          gh release create nightly dist/*.txz dist/SHA256SUMS \
            --verify-tag --title "Nightly ${GITHUB_SHA:0:12}" \
            --notes-file release-notes.md --prerelease --latest=false

  publish-crate:
    name: Publish to crates.io
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Validate the tagged package
        run: cargo publish --dry-run --locked
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish the tagged package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  verify-published-crate:
    name: Verify published installation
    needs: publish-crate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: uv
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: '1.25.3'
      - name: Install and verify the published binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo binstall fpc --version "${TAG#v}" --registry crates-io \
            --strategies crate-meta-data --no-confirm --install-path "$RUNNER_TEMP/binstall"
          ./tests/e2e/cli_behavior.py "$RUNNER_TEMP/binstall/fpc"
      - name: Install and verify the published source package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo install fpc --version "${TAG#v}" --registry crates-io \
            --locked --root "$RUNNER_TEMP/source"
          ./tests/e2e/cli_behavior.py "$RUNNER_TEMP/source/bin/fpc"
