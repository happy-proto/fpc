name: CI

on:
  workflow_call:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: uv jactionlint
      - name: Install Actions lockfile verifier
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0
      - name: Lint workflows
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run check-workflows
      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bash bash-completion fish zsh
      - name: Install shells (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash bash-completion@2 fish zsh
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: $/.github/actions/setup-rust
        with:
          save-downloads: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --timings
      - name: Shell completion E2E
        run: |
          cargo build --locked --timings
          ./tests/e2e/cli_behavior.py target/debug/fpc
          ./tests/e2e/release_checks.py
          ./tests/e2e/shell_completion.py target/debug/fpc

      - uses: $/.github/actions/build-diagnostics
        if: always()
        with:
          name: ci-build-${{ matrix.os }}

  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ci
    if: always()
    steps:
      - name: Require all checks to pass
        env:
          RESULT: ${{ needs.ci.result }}
        run: test "$RESULT" = success
