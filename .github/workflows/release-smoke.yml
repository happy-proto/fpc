name: Package smoke test

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: package-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Release required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: uv
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Validate package identity and version
        run: ./scripts/release.py --check-package
      - name: Package source without compiling release binaries
        run: cargo package --locked --no-verify
